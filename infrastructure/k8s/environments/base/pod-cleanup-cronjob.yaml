apiVersion: batch/v1
kind: CronJob
metadata:
  name: completed-pod-cleanup
spec:
  schedule: "*/30 * * * *"   # every 30 minutes
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 60
      template:
        spec:
          serviceAccountName: eutlas-backend
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  # Managed namespaces: the platform namespace plus every tenant
                  # namespace (eutlas-<projectId>). The old job only cleaned
                  # `eutlas`, so tenant backup/job pods piled up unbounded.
                  MANAGED=$(kubectl get ns -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
                    | grep -E '^eutlas$|^eutlas-')

                  for ns in $MANAGED; do
                    echo "Cleaning terminal pods in $ns..."
                    kubectl delete pods -n "$ns" --field-selector=status.phase=Succeeded \
                      --selector='debug-preserve!=true' 2>/dev/null || true
                    kubectl delete pods -n "$ns" --field-selector=status.phase=Failed \
                      --selector='debug-preserve!=true' 2>/dev/null || true
                  done

                  # Pods stuck in permanent container/image failures never reach a
                  # terminal phase, so field-selectors miss them and they accumulate
                  # against the node pod limit (this is what blocked HA scheduling).
                  # Delete such pods and, for backup jobs, the owning Job so it is
                  # not immediately recreated in the same broken state.
                  echo "Reaping stuck pods (CreateContainerConfigError/ImagePull*)..."
                  kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"|"}{.metadata.name}{"|"}{range .status.initContainerStatuses[*]}{.state.waiting.reason}{","}{end}{range .status.containerStatuses[*]}{.state.waiting.reason}{","}{end}{"\n"}{end}' \
                    | grep -E 'CreateContainerConfigError|ImagePullBackOff|ErrImagePull|InvalidImageName' \
                    | while IFS='|' read ns name reasons; do
                        case "$ns" in
                          eutlas|eutlas-*)
                            owner=$(kubectl get pod "$name" -n "$ns" \
                              -o jsonpath='{.metadata.ownerReferences[0].name}' 2>/dev/null)
                            kubectl delete pod "$name" -n "$ns" 2>/dev/null || true
                            case "$owner" in
                              backup-*) kubectl delete job "$owner" -n "$ns" 2>/dev/null || true ;;
                            esac
                            ;;
                        esac
                      done

                  # Evicted pods (phase=Failed, reason=Evicted) are terminal junk
                  # left behind by node memory/disk pressure. Rancher's own
                  # namespaces (cattle-system) never clean them, so hundreds pile
                  # up and bloat etcd/the API. Reap them cluster-wide.
                  echo "Reaping Evicted pods cluster-wide..."
                  kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"|"}{.metadata.name}{"|"}{.status.reason}{"\n"}{end}' \
                    | grep -E '\|Evicted$' \
                    | while IFS='|' read ns name reason; do
                        kubectl delete pod "$name" -n "$ns" 2>/dev/null || true
                      done
                  echo "Cleanup done."
              resources:
                limits:
                  cpu: "200m"
                  memory: 128Mi
                requests:
                  cpu: "50m"
                  memory: 32Mi
