apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-mongodb-backup-monitor
spec:
  # Check hourly that an off-site platform backup exists and is fresh.
  schedule: "17 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: platform-mongodb-backup-monitor
        spec:
          restartPolicy: Never
          containers:
            - name: check-offsite-backup
              # Pinned rclone: minio/mc was withdrawn from all public registries.
              image: rclone/rclone:1.75.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  export RCLONE_CONFIG_OFFSITE_REGION="$(echo "${RCLONE_CONFIG_OFFSITE_ENDPOINT}" | sed -E 's#^https?://([^.]+)\..*#\1#')"
                  SRC="offsite:${S3_BUCKET}/${S3_PREFIX:-platform-mongodb}"
                  MAX_AGE="${MAX_BACKUP_AGE:-26h}"
                  LATEST="$(rclone lsf --files-only --include 'platform-*.gz' --max-age "${MAX_AGE}" "${SRC}" | sort | tail -1)"

                  if [ -z "${LATEST}" ]; then
                    LATEST_ANY="$(rclone lsf --files-only --include 'platform-*.gz' "${SRC}" | sort | tail -1)"
                    echo "No platform backup archive newer than ${MAX_AGE}"
                    echo "Latest known archive: ${LATEST_ANY:-none}"
                    exit 1
                  fi

                  echo "Latest fresh off-site backup: ${LATEST}"
                  echo "Off-site backup freshness check passed"
              env:
                - { name: RCLONE_CONFIG_OFFSITE_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_OFFSITE_PROVIDER, value: Other }
                - name: RCLONE_CONFIG_OFFSITE_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: platform-backup-object-storage
                      key: endpoint
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: platform-backup-object-storage
                      key: bucket
                - name: S3_PREFIX
                  valueFrom:
                    secretKeyRef:
                      name: platform-backup-object-storage
                      key: prefix
                      optional: true
                - name: RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: platform-backup-object-storage
                      key: accessKey
                - name: RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: platform-backup-object-storage
                      key: secretKey
                - name: MAX_BACKUP_AGE
                  value: "26h"
              resources:
                limits:
                  cpu: "100m"
                  memory: 128Mi
                requests:
                  cpu: "25m"
                  memory: 64Mi
